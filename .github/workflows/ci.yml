name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python scripts/check_ci_required.py
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            huggingface-${{ runner.os }}-
      - run: uv sync --all-extras
      - name: Run core tests (non-docker, non-deno, non-subprocess, non-venv)
        run: |
          uv run pytest tests/ -v \
            -m "not docker and not deno and not subprocess and not venv" \
            --cov=src/py_code_mode \
            --cov-report=xml:coverage-core.xml \
            --cov-report=term \
            --cov-fail-under=0
      - name: Upload core coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-core.xml
          flags: core
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-subprocess-venv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            huggingface-${{ runner.os }}-
      - run: uv sync --all-extras
      - name: Run subprocess + venv tests
        run: |
          # Override default loadgroup scheduling for this lane.
          # loadscope allows subprocess-heavy classes/modules to run concurrently across workers.
          uv run pytest -n auto --dist loadscope tests/ -v \
            -m "(subprocess or venv) and not docker and not deno" \
            --cov=src/py_code_mode \
            --cov-report=xml:coverage-subprocess-venv.xml \
            --cov-report=term \
            --cov-fail-under=0
      - name: Upload subprocess/venv coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-subprocess-venv.xml
          flags: subprocess,venv
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-deno-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: denoland/setup-deno@v2
      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('src/py_code_mode/execution/deno_sandbox/runner/**') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - run: uv sync --all-extras
      - name: Run Deno sandbox integration tests
        env:
          PY_CODE_MODE_TEST_DENO: "1"
          DENO_DIR: ~/.cache/deno
        run: |
          uv run pytest -n 0 \
            tests/test_deno_sandbox_imports.py \
            tests/test_deno_sandbox_executor.py \
            tests/test_mcp_server_executor_selection.py::test_mcp_server_deno_backend_options_e2e \
            -v

  test-docker-backend-user-journeys:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed packages we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - name: Run docker tests (shard A)
        run: |
          # Run docker tests with xdist auto-workers (one per available core).
          # Use loadscope to spread classes/modules while preserving local fixture grouping.
          uv run pytest -n auto --dist loadscope -v -m docker \
            tests/test_backend_user_journey.py

  test-docker-storage-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed packages we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - name: Run docker tests (shard B)
        run: |
          # Run docker tests with xdist auto-workers (one per available core).
          uv run pytest -n auto --dist loadscope -v -m docker \
            tests/test_deps_config_gaps.py \
            tests/test_feature_matrix_comprehensive.py \
            tests/test_mcp_server_executor_selection.py \
            tests/test_redis_vector_store.py

  test-docker-session-and-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed packages we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - name: Run docker tests (shard C)
        run: |
          # Run docker tests with xdist auto-workers (one per available core).
          uv run pytest -n auto --dist loadscope -v -m docker \
            tests/test_session.py \
            tests/test_redis_artifacts.py \
            tests/test_deps_store.py \
            tests/test_redis_tools.py \
            tests/test_subprocess_namespace_injection.py

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - lint
      - test-core
      - test-subprocess-venv
      - test-deno-sandbox
      - test-docker-backend-user-journeys
      - test-docker-storage-and-mcp
      - test-docker-session-and-redis
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required CI job failed
        if: |
          needs.lint.result != 'success' ||
          needs.test-core.result != 'success' ||
          needs.test-subprocess-venv.result != 'success' ||
          needs.test-deno-sandbox.result != 'success' ||
          needs.test-docker-backend-user-journeys.result != 'success' ||
          needs.test-docker-storage-and-mcp.result != 'success' ||
          needs.test-docker-session-and-redis.result != 'success'
        run: |
          echo "At least one required CI job did not succeed."
          echo "lint=${{ needs.lint.result }}"
          echo "test-core=${{ needs.test-core.result }}"
          echo "test-subprocess-venv=${{ needs.test-subprocess-venv.result }}"
          echo "test-deno-sandbox=${{ needs.test-deno-sandbox.result }}"
          echo "test-docker-backend-user-journeys=${{ needs.test-docker-backend-user-journeys.result }}"
          echo "test-docker-storage-and-mcp=${{ needs.test-docker-storage-and-mcp.result }}"
          echo "test-docker-session-and-redis=${{ needs.test-docker-session-and-redis.result }}"
          exit 1

      - name: Confirm all required CI jobs passed
        run: echo "All required CI jobs passed."
