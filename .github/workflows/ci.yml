name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed packages we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # NOTE: Don't prune Docker images - keeps base images cached for faster builds
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            huggingface-${{ runner.os }}-
      - run: uv sync --all-extras
      # Keep coverage job fast; container backend E2E runs in dedicated job below.
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --ignore=tests/test_container.py -k "not Container" --cov=src/py_code_mode --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-deno-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: denoland/setup-deno@v2
      - name: Cache Deno modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('src/py_code_mode/execution/deno_sandbox/runner/**') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - run: uv sync --all-extras
      - name: Run Deno sandbox integration tests
        env:
          PY_CODE_MODE_TEST_DENO: "1"
          DENO_DIR: ~/.cache/deno
        run: |
          uv run pytest -n 0 \
            tests/test_deno_sandbox_imports.py \
            tests/test_deno_sandbox_executor.py \
            tests/test_mcp_server_executor_selection.py::test_mcp_server_deno_backend_options_e2e \
            -v

  test-mcp-container-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed packages we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - name: Run MCP container backend E2E test
        run: uv run pytest -n 0 tests/test_mcp_server_executor_selection.py::test_mcp_server_container_backend_options_e2e -v
